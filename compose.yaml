services:
    laravel.test:
        build:
            context: ./vendor/laravel/sail/runtimes/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${APP_PORT:-80}:80'
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        environment:
            WWWUSER: '${WWWUSER:-1337}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            TZ: '${APP_TIMEZONE:-America/Sao_Paulo}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
    # Horizon runs in its own container: in production the queue workers scale
    # independently of the web tier, and a web deploy must not restart workers.
    horizon:
        image: sail-8.5/app
        command: ['php', 'artisan', 'horizon']
        stop_signal: SIGTERM
        stop_grace_period: 60s
        environment:
            WWWUSER: '${WWWUSER:-1337}'
            LARAVEL_SAIL: 1
            TZ: '${APP_TIMEZONE:-America/Sao_Paulo}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
    # The scheduler is also separated: exactly one instance must run, whereas the
    # web tier may have many replicas.
    scheduler:
        image: sail-8.5/app
        command: ['php', 'artisan', 'schedule:work']
        environment:
            WWWUSER: '${WWWUSER:-1337}'
            LARAVEL_SAIL: 1
            TZ: '${APP_TIMEZONE:-America/Sao_Paulo}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            pgsql:
                condition: service_healthy
            redis:
                condition: service_healthy
        restart: unless-stopped
    pgsql:
        image: 'postgres:18-alpine'
        ports:
            - '${FORWARD_DB_PORT:-5432}:5432'
        environment:
            PGPASSWORD: '${DB_PASSWORD:-secret}'
            POSTGRES_DB: '${DB_DATABASE}'
            POSTGRES_USER: '${DB_USERNAME}'
            POSTGRES_PASSWORD: '${DB_PASSWORD:-secret}'
            # pt-BR collation comes from the ICU provider, not from a libc locale:
            # the alpine image ships no glibc locales, so --locale=pt_BR.UTF-8
            # would make initdb fail. ICU is compiled into the image and gives
            # correct Portuguese ordering for ORDER BY on product titles.
            POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale-provider=icu --icu-locale=pt-BR --locale=C.UTF-8'
            TZ: 'America/Sao_Paulo'
            PGTZ: 'America/Sao_Paulo'
        command:
            - postgres
            - -c
            - shared_buffers=512MB
            - -c
            - work_mem=32MB
            - -c
            - maintenance_work_mem=256MB
            - -c
            - effective_cache_size=1536MB
            - -c
            - max_connections=120
            - -c
            - random_page_cost=1.1
            - -c
            - log_min_duration_statement=500
            - -c
            - track_io_timing=on
            - -c
            - shared_preload_libraries=pg_stat_statements
        volumes:
            - 'sail-pgsql:/var/lib/postgresql'
            - './docker/pgsql/init:/docker-entrypoint-initdb.d'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - pg_isready
                - '-q'
                - '-d'
                - '${DB_DATABASE}'
                - '-U'
                - '${DB_USERNAME}'
            retries: 5
            timeout: 10s
    redis:
        image: 'redis:7-alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        command:
            - redis-server
            - --appendonly
            - 'yes'
            - --maxmemory-policy
            - noeviction
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    mailpit:
        image: 'axllent/mailpit:latest'
        ports:
            - '${FORWARD_MAILPIT_PORT:-1025}:1025'
            - '${FORWARD_MAILPIT_DASHBOARD_PORT:-8025}:8025'
        networks:
            - sail
networks:
    sail:
        driver: bridge
volumes:
    sail-pgsql:
        driver: local
    sail-redis:
        driver: local
